<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Jinja – Room Decor Accra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.5s ease-out; }
    .card-hover { transition: all 0.3s; }
    .card-hover:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
    .price-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: #0A192F;
      padding: 6px 12px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1rem;
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 2;
      border: 1px solid rgba(255,255,255,0.2);
    }
    @media (min-width: 768px) {
      .price-badge { font-size: 1.1rem; padding: 8px 14px; }
    }
    body {
      background-color: #111827;
    }
    /* Invisible admin trigger – top‑left, under logo */
    .invisible-admin-trigger {
      position: fixed;
      top: 70px;   /* below the navbar */
      left: 10px;
      width: 80px;
      height: 80px;
      opacity: 0;
      cursor: pointer;
      z-index: 99999;
      background: transparent;
      border: none;
    }
  </style>
</head>
<body class="font-sans text-gray-100">

  <nav id="navbar" class="fixed w-full z-50 transition-all duration-300 bg-gray-900 shadow-lg border-b border-gray-800">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <div class="text-3xl md:text-4xl font-bold cursor-pointer flex items-center" onclick="showPage('home')">
        <span id="logoText" class="bg-gradient-to-r from-[#0A192F] to-white bg-clip-text text-transparent">Jinja</span>
        <img id="logoImg" class="h-14 md:h-16 hidden object-contain" alt="Jinja Logo">
      </div>
      <div class="flex items-center space-x-4 md:space-x-6">
        <a href="#" onclick="showPage('home')" class="hover:text-[#0A192F] transition text-sm md:text-base text-gray-200">Home</a>
        <a href="#" onclick="showPage('shop')" class="hover:text-[#0A192F] transition text-sm md:text-base text-gray-200">Shop</a>
        <!-- Admin button removed -->
        <div class="relative">
          <button onclick="toggleCurrencyDropdown()" class="bg-[#0A192F]/30 px-2 md:px-3 py-2 rounded-lg flex items-center space-x-2 text-sm text-white">
            <i class="fas fa-dollar-sign text-white"></i>
            <span id="currencyCode">GHS</span>
            <i class="fas fa-chevron-down text-xs"></i>
          </button>
          <div id="currencyDropdown" class="absolute right-0 mt-2 w-40 bg-gray-800 border border-[#0A192F] rounded-lg hidden z-50"></div>
        </div>
        <button onclick="showCart()" class="relative">
          <i class="fas fa-shopping-cart text-xl text-white"></i>
          <span id="cartCount" class="absolute -top-2 -right-2 bg-[#0A192F] text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </nav>

  <div id="app" class="pt-20 min-h-screen pb-16"></div>

  <div id="cartSidebar" class="fixed top-0 right-0 w-full md:w-96 h-full bg-gray-800 shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col border-l border-gray-700">
    <div class="p-5 flex-1 flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-white">Your Cart</h2>
        <button onclick="closeCart()" class="text-2xl text-gray-300 hover:text-white">&times;</button>
      </div>
      <div id="cartItems" class="flex-1 overflow-y-auto space-y-4"></div>
      <div class="border-t border-gray-600 pt-4 mt-4">
        <div class="flex justify-between text-xl font-bold mb-4 text-white">
          <span>Total</span>
          <span id="cartTotal">₵0.00</span>
        </div>
        <button onclick="whatsappBuy()" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-lg font-semibold transition">Buy via WhatsApp</button>
      </div>
    </div>
  </div>

  <div id="adminModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 border border-gray-700">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-white" id="modalTitle">Add Product</h2>
        <button onclick="closeAdminModal()" class="text-2xl text-gray-300 hover:text-white">&times;</button>
      </div>
      <form id="productForm">
        <input type="text" id="prodName" placeholder="Product name" class="w-full mb-3 p-3 bg-gray-900 rounded border border-gray-600 text-white" required>
        <textarea id="prodDesc" placeholder="Description" rows="3" class="w-full mb-3 p-3 bg-gray-900 rounded border border-gray-600 text-white" required></textarea>
        <input type="number" step="0.01" id="prodPrice" placeholder="Price (GHS)" class="w-full mb-3 p-3 bg-gray-900 rounded border border-gray-600 text-white" required>
        <select id="prodCategory" class="w-full mb-3 p-3 bg-gray-900 rounded border border-gray-600 text-white">
          <option>Wall Art</option><option>Lighting</option><option>Cushions</option><option>Vases</option>
          <option>Rugs</option><option>Mirrors</option><option>Plants</option><option>Other</option>
        </select>
        <label class="flex items-center mb-3 text-gray-200"><input type="checkbox" id="prodInStock" checked class="mr-2"> In Stock</label>
        <div id="existingImagesContainer" class="flex flex-wrap gap-2 mb-3"></div>
        <input type="file" id="prodImages" multiple accept="image/*" class="mb-3 text-gray-300">
        <button type="submit" class="w-full bg-[#0A192F] hover:bg-[#0A192F]/80 py-3 rounded-lg font-semibold text-white transition">Save Product</button>
      </form>
    </div>
  </div>

  <!-- Invisible admin trigger – top-left, under logo -->
  <button class="invisible-admin-trigger" onclick="handleAdminTrigger()" aria-label="Admin (invisible)"></button>

  <script>
    const API_URL = '/api';
    let cartId = localStorage.getItem('cartId') || crypto.randomUUID();
    localStorage.setItem('cartId', cartId);
    let cart = { items: [] };
    let exchangeRates = { USD: 1, GHS: 1 };
    let selectedCurrency = { code: 'GHS', symbol: '₵' };
    let adminToken = localStorage.getItem('adminToken');
    let logoUrl = null;
    let currentPage = 'home';

    async function fetchRates() {
      try {
        const res = await axios.get('https://api.exchangerate-api.com/v4/latest/USD');
        exchangeRates = res.data.rates;
      } catch(e) { console.error(e); }
    }
    function convertPrice(priceGHS) {
      if (selectedCurrency.code === 'GHS') return priceGHS;
      const ghsToUsd = 1 / exchangeRates.GHS;
      const priceUSD = priceGHS * ghsToUsd;
      const targetRate = exchangeRates[selectedCurrency.code];
      if (!targetRate) return priceGHS;
      return priceUSD * targetRate;
    }
    function formatPrice(priceGHS) {
      let val = convertPrice(priceGHS);
      if (selectedCurrency.code === 'JPY') return selectedCurrency.symbol + Math.round(val);
      return selectedCurrency.symbol + val.toFixed(2);
    }

    async function fetchCart() {
      try {
        const res = await axios.get(`${API_URL}/cart/${cartId}`);
        cart = res.data;
        updateCartUI();
      } catch(e) { console.error(e); }
    }
    async function addToCart(productId, qty = 1) {
      await axios.post(`${API_URL}/cart/${cartId}/items`, { productId, quantity: qty });
      fetchCart();
    }
    async function updateCartItem(productId, qty) {
      await axios.put(`${API_URL}/cart/${cartId}/items/${productId}`, { quantity: qty });
      fetchCart();
    }
    async function removeCartItem(productId) {
      await axios.delete(`${API_URL}/cart/${cartId}/items/${productId}`);
      fetchCart();
    }
    function updateCartUI() {
      const count = cart.items.reduce((s,i)=>s+i.quantity,0);
      document.getElementById('cartCount').innerText = count;
      const container = document.getElementById('cartItems');
      if (!cart.items.length) { container.innerHTML = '<p class="text-gray-400">Cart is empty</p>'; document.getElementById('cartTotal').innerText = formatPrice(0); return; }
      let html = '', totalGHS = 0;
      cart.items.forEach(item => {
        const p = item.productId;
        totalGHS += p.priceGHS * item.quantity;
        html += `<div class="flex gap-3 border-b border-gray-600 pb-3">
          <img src="${p.images[0]}" class="w-16 h-16 object-cover rounded">
          <div class="flex-1"><div class="font-semibold text-white">${p.name}</div><div class="text-gray-300">${formatPrice(p.priceGHS)}</div>
          <div class="flex items-center gap-2 mt-1"><button onclick="updateCartItem('${p._id}',${item.quantity-1})" class="px-2 bg-gray-700 rounded text-white">-</button>
          <span class="text-white">${item.quantity}</span><button onclick="updateCartItem('${p._id}',${item.quantity+1})" class="px-2 bg-gray-700 rounded text-white">+</button>
          <button onclick="removeCartItem('${p._id}')" class="text-red-500 ml-2"><i class="fas fa-trash"></i></button></div></div></div>`;
      });
      container.innerHTML = html;
      document.getElementById('cartTotal').innerHTML = formatPrice(totalGHS);
    }
    function showCart() { document.getElementById('cartSidebar').classList.remove('translate-x-full'); }
    function closeCart() { document.getElementById('cartSidebar').classList.add('translate-x-full'); }
    async function whatsappBuy() {
      if (!cart.items.length) return alert('Your cart is empty');
      let msg = "🛍️ *Jinja Order* 🛍️\n";
      let totalGHS = 0;
      cart.items.forEach((item, idx) => {
        const p = item.productId;
        totalGHS += p.priceGHS * item.quantity;
        msg += `${idx+1}. ${p.name} x${item.quantity} - ${formatPrice(p.priceGHS * item.quantity)}\n`;
      });
      msg += `\n*Total: ${formatPrice(totalGHS)}*\nLocation: Accra, Ghana`;
      window.location.href = `https://wa.me/233546311518?text=${encodeURIComponent(msg)}`;
    }

    function toggleCurrencyDropdown() { document.getElementById('currencyDropdown').classList.toggle('hidden'); }
    const currencies = [
      { code: 'USD', symbol: '$', name: 'US Dollar' }, { code: 'EUR', symbol: '€', name: 'Euro' },
      { code: 'GBP', symbol: '£', name: 'Pound' }, { code: 'GHS', symbol: '₵', name: 'Ghana Cedi' },
      { code: 'NGN', symbol: '₦', name: 'Naira' }, { code: 'CAD', symbol: 'C$', name: 'Canadian Dollar' },
      { code: 'AUD', symbol: 'A$', name: 'Australian Dollar' }, { code: 'JPY', symbol: '¥', name: 'Yen' }
    ];
    function setCurrency(curr) {
      selectedCurrency = curr;
      document.getElementById('currencyCode').innerText = curr.code;
      document.getElementById('currencyDropdown').classList.add('hidden');
      rerenderCurrentPage();
      updateCartUI();
    }

    let productsCache = [];
    let categoriesCache = [];

    async function fetchProducts(page = 1, category = 'all', search = '') {
      const url = `${API_URL}/products?page=${page}&category=${category}&search=${search}`;
      const res = await axios.get(url);
      productsCache = res.data.products;
      return res.data;
    }
    async function fetchCategories() {
      const res = await axios.get(`${API_URL}/categories`);
      categoriesCache = res.data;
    }

    async function renderHome() {
      const data = await fetchProducts(1, 'all', '');
      const allProducts = data.products;
      let productsHtml = '';
      if (allProducts.length === 0) {
        productsHtml = '<p class="text-gray-400 col-span-full text-center py-10">No products yet. Check back soon!</p>';
      } else {
        allProducts.forEach(p => {
          productsHtml += `<div class="bg-gray-800 rounded-xl overflow-hidden card-hover relative border border-gray-700">
            <img src="${p.images[0]}" class="h-56 w-full object-cover">
            <div class="price-badge">${formatPrice(p.priceGHS)}</div>
            <div class="p-4">
              <h3 class="font-bold text-xl text-white">${p.name}</h3>
              <p class="text-gray-300 text-sm mt-1 line-clamp-2">${p.description.substring(0, 80)}${p.description.length > 80 ? '...' : ''}</p>
              <button onclick="addToCart('${p._id}')" class="mt-3 w-full bg-[#0A192F] hover:bg-[#0A192F]/80 py-2 rounded transition text-white">Add to Cart</button>
            </div>
          </div>`;
        });
      }
      document.getElementById('app').innerHTML = `
        <div class="relative h-screen flex items-center justify-center overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-r from-gray-900 via-gray-900/80 to-transparent z-10"></div>
          <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?q=80&w=2070')] bg-cover bg-center"></div>
          <div class="container mx-auto px-4 relative z-20 text-center md:text-left">
            <h1 class="text-5xl md:text-7xl font-bold mb-6 animate-fade-in-up text-white">Transform Your Space<br><span class="text-[#0A192F]">with Jinja</span></h1>
            <p class="text-xl text-gray-200 mb-8 max-w-2xl">Premium room decoration items from Accra to the world.</p>
            <button onclick="showPage('shop')" class="bg-[#0A192F] hover:bg-[#0A192F]/80 text-white px-8 py-4 rounded-lg text-lg font-semibold hover:scale-105 transition">Shop Now</button>
          </div>
        </div>
        <div class="py-20 bg-gray-900">
          <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-10 text-white">Our Collection</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
              ${productsHtml}
            </div>
          </div>
        </div>
      `;
    }

    async function renderShop() {
      await fetchCategories();
      document.getElementById('app').innerHTML = `
        <div class="container mx-auto px-4 py-8">
          <h1 class="text-3xl font-bold mb-6 text-white">All Products</h1>
          <div class="flex flex-wrap gap-4 mb-6">
            <input type="text" id="searchInput" placeholder="Search..." class="bg-gray-800 px-4 py-2 rounded flex-1 border border-gray-700 text-white">
            <select id="categoryFilter" class="bg-gray-800 px-4 py-2 rounded border border-gray-700 text-white"></select>
          </div>
          <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
          <div id="pagination" class="flex justify-center mt-8 gap-2"></div>
        </div>
      `;
      const catSelect = document.getElementById('categoryFilter');
      let catHtml = '<option value="all">All Categories</option>';
      categoriesCache.forEach(c => catHtml += `<option value="${c}">${c}</option>`);
      catSelect.innerHTML = catHtml;
      catSelect.onchange = () => filterAndPaginate(1);
      document.getElementById('searchInput').oninput = () => filterAndPaginate(1);
      await filterAndPaginate(1);
    }

    let currentFilters = { category: 'all', search: '', page: 1, totalPages: 1 };
    async function filterAndPaginate(page) {
      currentFilters.page = page;
      currentFilters.category = document.getElementById('categoryFilter')?.value || 'all';
      currentFilters.search = document.getElementById('searchInput')?.value || '';
      const res = await axios.get(`${API_URL}/products?page=${page}&category=${currentFilters.category}&search=${currentFilters.search}`);
      const products = res.data.products;
      currentFilters.totalPages = res.data.totalPages;
      const grid = document.getElementById('productsGrid');
      if (!grid) return;
      let html = '';
      products.forEach(p => {
        html += `<div class="bg-gray-800 rounded-xl overflow-hidden card-hover relative border border-gray-700">
          <img src="${p.images[0]}" class="h-56 w-full object-cover">
          <div class="price-badge">${formatPrice(p.priceGHS)}</div>
          <div class="p-4">
            <div class="text-sm text-[#0A192F] font-semibold">${p.category}</div>
            <h3 class="font-bold text-lg text-white">${p.name}</h3>
            <button onclick="addToCart('${p._id}')" class="mt-3 w-full bg-[#0A192F] hover:bg-[#0A192F]/80 py-2 rounded transition text-white">Add to Cart</button>
          </div>
        </div>`;
      });
      grid.innerHTML = html || '<p class="text-gray-400 col-span-full text-center">No products found</p>';
      let pagHtml = '';
      for (let i=1; i<=currentFilters.totalPages; i++) {
        pagHtml += `<button onclick="filterAndPaginate(${i})" class="px-3 py-1 rounded ${i===currentFilters.page?'bg-[#0A192F]':'bg-gray-700'} text-white">${i}</button>`;
      }
      document.getElementById('pagination').innerHTML = pagHtml;
    }

    // Admin functions
    async function adminLogin(email, password) {
      try {
        const res = await axios.post(`${API_URL}/admin/login`, { email, password });
        adminToken = res.data.token;
        localStorage.setItem('adminToken', adminToken);
        showAdminPanel();
      } catch(e) { alert('Login failed'); }
    }

    async function showAdminPanel() {
      if (!adminToken) {
        showAdminLogin();
        return;
      }
      const res = await axios.get(`${API_URL}/admin/products`, { headers: { Authorization: `Bearer ${adminToken}` } });
      const products = res.data;
      let html = `
        <div class="container mx-auto px-4 py-8">
          <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-white">Admin Panel</h1>
            <button onclick="openProductModal()" class="bg-[#0A192F] hover:bg-[#0A192F]/80 px-4 py-2 rounded text-white">+ Add Product</button>
          </div>
          <div class="grid gap-3">
      `;
      products.forEach(p => {
        html += `<div class="bg-gray-800 p-4 rounded flex justify-between items-center border border-gray-700">
          <div class="flex items-center gap-3"><img src="${p.images[0]}" class="w-12 h-12 object-cover rounded"><div><strong class="text-white">${p.name}</strong><br><span class="text-sm text-gray-300">₵${p.priceGHS}</span></div></div>
          <div><button onclick="editProduct('${p._id}')" class="text-blue-400 mr-3">Edit</button><button onclick="deleteProduct('${p._id}')" class="text-red-400">Delete</button></div></div>`;
      });
      html += `
          </div>
          <!-- Logo upload -->
          <div class="mt-8">
            <h3 class="text-xl font-bold mb-2 text-white">Site Logo</h3>
            <input type="file" id="logoUploadAdmin" accept="image/*" class="text-gray-300">
            <button onclick="uploadLogo()" class="mt-2 bg-[#0A192F] hover:bg-[#0A192F]/80 px-4 py-2 rounded text-white">Upload Logo</button>
          </div>
          <!-- Password change -->
          <div class="mt-8 border-t border-gray-700 pt-6">
            <h3 class="text-xl font-bold mb-2 text-white">Change Admin Password</h3>
            <div class="max-w-sm">
              <input type="password" id="oldPassword" placeholder="Current password" class="w-full mb-3 p-3 bg-gray-900 rounded border border-gray-600 text-white">
              <input type="password" id="newPassword" placeholder="New password" class="w-full mb-3 p-3 bg-gray-900 rounded border border-gray-600 text-white">
              <input type="password" id="confirmPassword" placeholder="Confirm new password" class="w-full mb-3 p-3 bg-gray-900 rounded border border-gray-600 text-white">
              <button onclick="changePassword()" class="bg-[#0A192F] hover:bg-[#0A192F]/80 px-4 py-2 rounded text-white">Update Password</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('app').innerHTML = html;
    }

    function showAdminLogin() {
      document.getElementById('app').innerHTML = `
        <div class="max-w-md mx-auto mt-20 bg-gray-800 p-8 rounded-xl border border-gray-700">
          <h2 class="text-2xl font-bold mb-4 text-white">Admin Login</h2>
          <input type="email" id="adminEmail" class="w-full p-3 mb-3 bg-gray-900 rounded border border-gray-600 text-white" placeholder="Email">
          <input type="password" id="adminPass" class="w-full p-3 mb-3 bg-gray-900 rounded border border-gray-600 text-white" placeholder="Password">
          <button onclick="adminLogin(document.getElementById('adminEmail').value, document.getElementById('adminPass').value)" class="w-full bg-[#0A192F] hover:bg-[#0A192F]/80 py-3 rounded text-white">Login</button>
        </div>
      `;
    }

    // Password change function
    async function changePassword() {
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (newPassword !== confirmPassword) {
        alert('New passwords do not match');
        return;
      }
      if (newPassword.length < 6) {
        alert('New password must be at least 6 characters');
        return;
      }
      try {
        const res = await axios.post(`${API_URL}/admin/change-password`, { oldPassword, newPassword }, {
          headers: { Authorization: `Bearer ${adminToken}` }
        });
        alert(res.data.message);
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
      } catch (e) {
        alert(e.response?.data?.error || 'Failed to update password');
      }
    }

    function handleAdminTrigger() {
      if (adminToken) {
        showAdminPanel();
      } else {
        showAdminLogin();
      }
    }

    function openProductModal(productId = null) {
      window.editingProductId = productId;
      document.getElementById('modalTitle').innerText = productId ? 'Edit Product' : 'Add Product';
      document.getElementById('productForm').reset();
      document.getElementById('existingImagesContainer').innerHTML = '';
      if (productId) {
        axios.get(`${API_URL}/products/${productId}`).then(res => {
          const p = res.data;
          document.getElementById('prodName').value = p.name;
          document.getElementById('prodDesc').value = p.description;
          document.getElementById('prodPrice').value = p.priceGHS;
          document.getElementById('prodCategory').value = p.category;
          document.getElementById('prodInStock').checked = p.inStock;
          let imgsHtml = '';
          p.images.forEach((img, idx) => {
            imgsHtml += `<div class="relative"><img src="${img}" class="w-16 h-16 object-cover rounded"><button type="button" onclick="removeTempImage(${idx})" class="absolute -top-2 -right-2 bg-red-500 rounded-full w-5 h-5 text-xs text-white">x</button></div>`;
          });
          document.getElementById('existingImagesContainer').innerHTML = imgsHtml;
          window.existingImages = [...p.images];
        });
      } else { window.existingImages = []; }
      document.getElementById('adminModal').classList.remove('hidden');
    }
    function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); window.editingProductId = null; }
    function removeTempImage(idx) { window.existingImages.splice(idx,1); openProductModal(window.editingProductId); }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('prodName').value;
      const description = document.getElementById('prodDesc').value;
      const priceGHS = parseFloat(document.getElementById('prodPrice').value);
      const category = document.getElementById('prodCategory').value;
      const inStock = document.getElementById('prodInStock').checked;
      let images = window.existingImages || [];
      const files = document.getElementById('prodImages').files;
      if (files.length > 0) {
        for (let i = 0; i < files.length; i++) {
          const base64 = await fileToBase64(files[i]);
          images.push(base64);
        }
      }
      const productData = { name, description, priceGHS, category, inStock, images, stockQuantity: 999 };
      const url = window.editingProductId ? `${API_URL}/admin/products/${window.editingProductId}` : `${API_URL}/admin/products`;
      const method = window.editingProductId ? 'put' : 'post';
      await axios[method](url, productData, { headers: { Authorization: `Bearer ${adminToken}` } });
      closeAdminModal();
      showAdminPanel();
      if (currentPage === 'home') renderHome();
      else if (currentPage === 'shop') renderShop();
    });

    async function deleteProduct(id) {
      if (!confirm('Delete product?')) return;
      await axios.delete(`${API_URL}/admin/products/${id}`, { headers: { Authorization: `Bearer ${adminToken}` } });
      showAdminPanel();
      if (currentPage === 'home') renderHome();
      else if (currentPage === 'shop') renderShop();
    }
    function editProduct(id) { openProductModal(id); }

    async function uploadLogo() {
      const fileInput = document.getElementById('logoUploadAdmin');
      const file = fileInput.files[0];
      if (!file) { alert('Please select a logo file first'); return; }
      const base64 = await fileToBase64(file);
      await axios.post(`${API_URL}/admin/logo`, { logoBase64: base64 }, { headers: { Authorization: `Bearer ${adminToken}` } });
      alert('Logo updated');
      fetchSettings();
    }

    async function fetchSettings() {
      const res = await axios.get(`${API_URL}/settings`);
      if (res.data.logoUrl) {
        document.getElementById('logoImg').src = res.data.logoUrl;
        document.getElementById('logoImg').classList.remove('hidden');
        document.getElementById('logoText').classList.add('hidden');
      } else {
        document.getElementById('logoText').classList.remove('hidden');
      }
    }

    function showPage(page) {
      if (page === 'home') { currentPage = 'home'; renderHome(); }
      else if (page === 'shop') { currentPage = 'shop'; renderShop(); }
    }

    // Fallback: #admin in URL
    if (window.location.hash === '#admin') {
      handleAdminTrigger();
    }

    (async () => {
      await fetchRates();
      setInterval(fetchRates, 3600000);
      await fetchCart();
      await fetchSettings();
      let currHtml = '';
      currencies.forEach(c => currHtml += `<button onclick="setCurrency({code:'${c.code}',symbol:'${c.symbol}'})" class="block w-full text-left px-4 py-2 hover:bg-[#0A192F]/30 text-white">${c.code} - ${c.name}</button>`);
      document.getElementById('currencyDropdown').innerHTML = currHtml;
      renderHome();
    })();
  </script>
</body>
</html>
